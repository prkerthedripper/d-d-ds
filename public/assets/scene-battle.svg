<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070a"/><stop offset=".5" stop-color="#111013"/><stop offset=".8" stop-color="#231510"/><stop offset="1" stop-color="#080605"/>
    </linearGradient>
    <radialGradient id="torch" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffbe6e" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#e07b33" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e07b33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawn" cx=".5" cy="1" r=".8">
      <stop offset="0" stop-color="#7c3a1e" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7c3a1e" stop-opacity="0"/>
    </radialGradient>
    <filter id="smoke"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#night)"/>
  <ellipse cx="800" cy="760" rx="900" ry="260" fill="url(#dawn)"/>

  <!-- moon behind smoke -->
  <circle cx="420" cy="200" r="62" fill="#e7d6b4" opacity=".35"/>
  <circle cx="420" cy="200" r="170" fill="#e7d6b4" opacity=".07" filter="url(#smoke)"/>

  <!-- ragged fortress -->
  <g fill="#08090a">
    <path d="M1150 520 L1150 300 1180 300 1180 250 1210 250 1210 300 1240 300 1240 260 1270 260 1270 300 1300 300 1300 240 1330 240 1330 300 1360 300 1360 260 1390 260 1390 300 1420 300 1420 520Z"/>
    <path d="M1150 360 L1110 360 1110 420 1150 420Z"/>
    <rect x="1220" y="352" width="14" height="34" fill="#c98a45" opacity=".35"/>
    <rect x="1320" y="372" width="14" height="30" fill="#c98a45" opacity=".25"/>
  </g>

  <!-- smoke columns -->
  <g fill="#6b6259" filter="url(#smoke)">
    <ellipse cx="1180" cy="430" rx="130" ry="200" opacity=".22"/>
    <ellipse cx="940" cy="380" rx="180" ry="160" opacity=".16"/>
    <ellipse cx="600" cy="340" rx="220" ry="150" opacity=".12"/>
    <ellipse cx="1300" cy="300" rx="140" ry="180" opacity=".14"/>
  </g>

  <!-- distant spears + banners -->
  <g stroke="#0a0807" stroke-width="5">
    <path d="M120 640 L160 470"/><path d="M180 650 L200 490"/><path d="M240 640 L250 500"/>
    <path d="M1360 650 L1340 480"/><path d="M1420 660 L1400 500"/><path d="M1470 650 L1460 510"/>
  </g>
  <g fill="#141010">
    <path d="M160 470 l-10 30 20 0Z"/><path d="M200 490 l-9 28 18 0Z"/><path d="M1340 480 l-9 28 18 0Z"/>
    <path d="M400 690 L400 470 L470 492 L400 520Z" fill="#2c1212"/>
    <path d="M1100 700 L1100 500 L1170 520 L1100 548Z" fill="#2c1212"/>
  </g>

  <!-- broken ground -->
  <path d="M0 690 Q260 650 520 686 Q800 720 1060 682 Q1320 644 1600 690 L1600 900 L0 900Z" fill="#0b0a09"/>
  <path d="M0 760 Q300 720 620 756 Q940 792 1260 750 Q1450 726 1600 756 L1600 900 L0 900Z" fill="#060505"/>

  <!-- shattered shields + debris -->
  <g fill="#1b1512">
    <path d="M300 760 q60 -34 120 0 q-6 60 -60 84 q-54 -24 -60 -84Z"/>
    <path d="M700 800 q44 -26 88 0 q-4 44 -44 62 q-40 -18 -44 -62Z" opacity=".8"/>
    <path d="M1180 780 q56 -30 112 0 q-6 56 -56 78 q-50 -22 -56 -78Z" opacity=".9"/>
  </g>

  <!-- torches foreground -->
  <g>
    <circle cx="250" cy="560" r="190" fill="url(#torch)" filter="url(#glow)"/>
    <circle cx="1330" cy="580" r="200" fill="url(#torch)" filter="url(#glow)"/>
    <rect x="244" y="600" width="12" height="180" fill="#1a120c"/>
    <rect x="1324" y="620" width="12" height="180" fill="#1a120c"/>
    <path d="M250 560 q20 32 0 54 q-20 -22 0 -54Z" fill="#ffcd8a" opacity=".85"/>
    <path d="M1330 580 q20 32 0 54 q-20 -22 0 -54Z" fill="#ffcd8a" opacity=".85"/>
  </g>

  <!-- embers -->
  <g fill="#f0b56a" opacity=".6">
    <circle cx="340" cy="500" r="2"/><circle cx="420" cy="600" r="1.6"/><circle cx="1180" cy="520" r="2.2"/>
    <circle cx="1260" cy="620" r="1.4"/><circle cx="800" cy="600" r="1.8"/><circle cx="960" cy="660" r="1.2"/>
  </g>
</svg>
