<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04070b"/><stop offset=".45" stop-color="#0b1a20"/>
      <stop offset=".72" stop-color="#1b2a2a"/><stop offset="1" stop-color="#080c0a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f7e9c4" stop-opacity=".9"/>
      <stop offset=".28" stop-color="#e6d2a4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d8c393" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c8bf" stop-opacity="0"/>
      <stop offset=".5" stop-color="#b9c8bf" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b9c8bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1210"/><stop offset="1" stop-color="#040706"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#e8dcbd" opacity=".55">
    <circle cx="180" cy="90" r="1.4"/><circle cx="320" cy="150" r="1"/><circle cx="470" cy="70" r="1.2"/>
    <circle cx="620" cy="130" r="1.6"/><circle cx="760" cy="60" r="1"/><circle cx="905" cy="120" r="1.3"/>
    <circle cx="1040" cy="80" r="1"/><circle cx="1210" cy="140" r="1.5"/><circle cx="1360" cy="70" r="1.1"/>
    <circle cx="1480" cy="170" r="1.3"/><circle cx="240" cy="220" r="1"/><circle cx="700" cy="200" r="1"/>
  </g>

  <!-- moon -->
  <circle cx="1180" cy="215" r="250" fill="url(#moonGlow)"/>
  <circle cx="1180" cy="215" r="62" fill="#f6e9c8" opacity=".92"/>
  <circle cx="1158" cy="198" r="14" fill="#e2d0a6" opacity=".5"/>
  <circle cx="1200" cy="238" r="9" fill="#e2d0a6" opacity=".4"/>

  <!-- distant ridge + keep -->
  <path d="M0 470 L180 388 330 442 470 372 610 436 760 366 900 430 1060 380 1200 440 1340 392 1470 446 1600 402 1600 900 0 900Z"
        fill="#0c1618" opacity=".95"/>
  <g fill="#070e10">
    <path d="M980 432 L1010 432 1010 388 1032 388 1032 432 1050 432 1050 360 1062 352 1074 360 1074 432 1098 432 1098 404 1120 404 1120 432 1146 432 1146 470 980 470Z"/>
    <path d="M1050 360 L1062 332 1074 360Z"/>
    <rect x="1030" y="400" width="8" height="16" fill="#e8c98a" opacity=".45"/>
    <rect x="1104" y="412" width="8" height="14" fill="#e8c98a" opacity=".3"/>
  </g>

  <!-- pine ridges, three depths -->
  <g fill="#0a1415" opacity=".9">
    <path d="M0 560 L60 470 120 560 180 486 240 566 300 470 360 560 420 500 480 566 540 480 600 560 660 496 720 566 780 486 840 560 900 500 960 566 1020 486 1080 560 1140 500 1200 566 1260 486 1320 560 1380 500 1440 566 1500 486 1560 560 1600 520 1600 900 0 900Z"/>
  </g>
  <g fill="#060f10">
    <path d="M0 660 L40 520 80 640 110 566 150 660 200 540 250 660 300 580 350 670 410 544 470 660 520 590 580 672 640 552 700 660 760 588 820 672 880 556 940 660 1000 592 1060 672 1120 552 1180 660 1240 590 1300 672 1360 556 1420 660 1480 592 1540 672 1600 600 1600 900 0 900Z"/>
  </g>

  <!-- mist -->
  <rect x="-100" y="560" width="1800" height="230" fill="url(#mist)" filter="url(#softer)"/>
  <rect x="-100" y="660" width="1800" height="160" fill="url(#mist)" opacity=".7" filter="url(#soft)"/>

  <!-- path + ground -->
  <path d="M0 900 L520 690 Q800 640 1080 700 L1600 900Z" fill="url(#ground)"/>
  <path d="M770 900 Q820 760 860 690 L900 694 Q860 770 850 900Z" fill="#141d18" opacity=".65"/>

  <!-- foreground firs -->
  <g fill="#030707">
    <path d="M60 900 L100 560 140 900Z"/><path d="M30 900 L100 640 170 900Z"/>
    <path d="M1400 900 L1440 520 1480 900Z"/><path d="M1330 900 L1440 610 1560 900Z"/>
    <path d="M1520 900 L1560 600 1600 900Z"/>
  </g>
  <g stroke="#030707" stroke-width="6" fill="none" opacity=".9">
    <path d="M0 250 Q120 300 210 240"/><path d="M1600 190 Q1470 250 1380 200"/>
  </g>

  <!-- fireflies -->
  <g fill="#e9d29c">
    <circle cx="540" cy="720" r="2.4" opacity=".8"/><circle cx="620" cy="760" r="1.8" opacity=".6"/>
    <circle cx="700" cy="700" r="2" opacity=".7"/><circle cx="900" cy="744" r="1.6" opacity=".5"/>
    <circle cx="1010" cy="710" r="2.2" opacity=".75"/><circle cx="1140" cy="768" r="1.7" opacity=".55"/>
  </g>
  <g fill="#f4dda6" filter="url(#soft)" opacity=".35">
    <circle cx="540" cy="720" r="8"/><circle cx="1010" cy="710" r="7"/><circle cx="700" cy="700" r="6"/>
  </g>
</svg>
