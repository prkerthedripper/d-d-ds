<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a08"/><stop offset=".55" stop-color="#151109"/><stop offset="1" stop-color="#060505"/>
    </linearGradient>
    <radialGradient id="candle" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd899" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#e2a34e" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e2a34e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a11"/><stop offset="1" stop-color="#140e09"/>
    </linearGradient>
    <radialGradient id="arch" cx=".5" cy=".2" r=".8">
      <stop offset="0" stop-color="#b8b6a0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#b8b6a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#room)"/>
  <ellipse cx="800" cy="150" rx="520" ry="320" fill="url(#arch)"/>

  <!-- bookcases -->
  <g>
    <rect x="60" y="90" width="330" height="740" fill="url(#shelf)"/>
    <rect x="1210" y="90" width="330" height="740" fill="url(#shelf)"/>
    <g stroke="#3a2a1a" stroke-width="3">
      <path d="M60 240 L390 240 M60 390 L390 390 M60 540 L390 540 M60 690 L390 690"/>
      <path d="M1210 240 L1540 240 M1210 390 L1540 390 M1210 540 L1540 540 M1210 690 L1540 690"/>
    </g>
    <!-- books left -->
    <g fill="#5a3b22">
      <rect x="80" y="150" width="18" height="88"/><rect x="102" y="160" width="14" height="78"/>
      <rect x="120" y="140" width="22" height="98"/><rect x="148" y="158" width="16" height="80"/>
      <rect x="172" y="132" width="20" height="106"/><rect x="198" y="164" width="14" height="74"/>
      <rect x="220" y="146" width="24" height="92"/><rect x="250" y="160" width="16" height="78"/>
    </g>
    <g fill="#6b4326">
      <rect x="300" y="152" width="18" height="86"/><rect x="322" y="138" width="14" height="100"/>
      <rect x="342" y="158" width="20" height="80"/><rect x="366" y="146" width="12" height="92"/>
    </g>
    <g fill="#4a3320">
      <rect x="90" y="300" width="16" height="88"/><rect x="112" y="288" width="20" height="100"/>
      <rect x="140" y="310" width="14" height="78"/><rect x="160" y="292" width="18" height="96"/>
      <rect x="186" y="306" width="22" height="82"/><rect x="214" y="296" width="14" height="92"/>
      <rect x="330" y="304" width="18" height="84"/><rect x="354" y="290" width="14" height="98"/>
    </g>
    <!-- books right -->
    <g fill="#5a3b22">
      <rect x="1240" y="150" width="18" height="88"/><rect x="1262" y="160" width="14" height="78"/>
      <rect x="1280" y="140" width="22" height="98"/><rect x="1308" y="158" width="16" height="80"/>
      <rect x="1332" y="132" width="20" height="106"/><rect x="1358" y="164" width="14" height="74"/>
      <rect x="1380" y="146" width="24" height="92"/><rect x="1412" y="160" width="16" height="78"/>
    </g>
    <g fill="#4a3320">
      <rect x="1240" y="300" width="16" height="88"/><rect x="1262" y="288" width="20" height="100"/>
      <rect x="1290" y="310" width="14" height="78"/><rect x="1310" y="292" width="18" height="96"/>
      <rect x="1336" y="306" width="22" height="82"/><rect x="1364" y="296" width="14" height="92"/>
    </g>
  </g>

  <!-- central arch + ladder -->
  <path d="M560 900 L560 320 Q800 110 1040 320 L1040 900Z" fill="#0e0c09" stroke="#261c12" stroke-width="4"/>
  <path d="M620 900 L620 380 Q800 220 980 380 L980 900Z" fill="#0a0907"/>
  <g stroke="#332416" stroke-width="6" opacity=".9">
    <path d="M1100 900 L1170 250"/><path d="M1160 900 L1230 250"/>
    <path d="M1124 760 L1194 760 M1140 620 L1210 620 M1156 480 L1226 480 M1172 340 L1242 340"/>
  </g>

  <!-- desk with open tome -->
  <rect x="420" y="720" width="500" height="26" fill="#2c1f13"/>
  <rect x="440" y="746" width="20" height="120" fill="#1d150d"/>
  <rect x="880" y="746" width="20" height="120" fill="#1d150d"/>
  <g>
    <path d="M560 700 L660 726 L660 706 L560 682Z" fill="#c8b48b" opacity=".85"/>
    <path d="M660 726 L760 700 L760 682 L660 706Z" fill="#bca77e" opacity=".85"/>
    <path d="M560 682 L660 706 L660 726 L560 700Z" fill="#e0cfa6" opacity=".5"/>
    <path d="M660 680 L710 690 L710 720 L660 706Z" fill="#d8c69c" opacity=".35"/>
  </g>

  <!-- candles -->
  <g>
    <circle cx="1270" cy="620" r="150" fill="url(#candle)" filter="url(#b1)"/>
    <circle cx="330" cy="640" r="140" fill="url(#candle)" filter="url(#b1)"/>
    <circle cx="985" cy="520" r="90" fill="url(#candle)" filter="url(#b1)"/>
    <g fill="#e3d6b8">
      <rect x="1264" y="660" width="12" height="54"/><rect x="324" y="676" width="11" height="48"/>
    </g>
    <path d="M1270 640 q10 18 0 30 q-10 -12 0 -30Z" fill="#ffd18a" opacity=".85"/>
    <path d="M329 656 q9 16 0 27 q-9 -11 0 -27Z" fill="#ffd18a" opacity=".85"/>
  </g>

  <!-- floating motes / sigils -->
  <g stroke="#c9a35c" fill="none" opacity=".22">
    <circle cx="860" cy="470" r="52"/><circle cx="860" cy="470" r="70"/>
    <path d="M860 420 L903 495 L817 495Z"/>
  </g>
  <g fill="#f0dcae" opacity=".5">
    <circle cx="760" cy="420" r="1.6"/><circle cx="900" cy="380" r="1.2"/><circle cx="830" cy="560" r="1.4"/>
    <circle cx="960" cy="470" r="1"/><circle cx="700" cy="500" r="1.1"/>
  </g>
</svg>
