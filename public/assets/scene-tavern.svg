<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0705"/><stop offset=".55" stop-color="#1a1109"/><stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <radialGradient id="fire" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb15e" stop-opacity=".7"/>
      <stop offset=".35" stop-color="#d9713a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d9713a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a10"/><stop offset="1" stop-color="#120d08"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#air)"/>

  <!-- ceiling beams -->
  <g fill="url(#beam)">
    <rect x="0" y="0" width="1600" height="52"/>
    <rect x="120" y="52" width="46" height="300"/><rect x="620" y="52" width="46" height="260"/>
    <rect x="980" y="52" width="46" height="280"/><rect x="1450" y="52" width="46" height="320"/>
    <rect x="0" y="150" width="1600" height="26" opacity=".55"/>
  </g>

  <!-- back wall, hearth and shelves -->
  <rect x="0" y="300" width="1600" height="500" fill="#160f09"/>
  <g>
    <path d="M620 760 L620 500 Q760 400 900 500 L900 760Z" fill="#0b0705" stroke="#2c2013" stroke-width="8"/>
    <path d="M660 760 L660 540 Q760 470 860 540 L860 760Z" fill="#1a0f08"/>
    <circle cx="760" cy="700" r="220" fill="url(#fire)" filter="url(#soft)"/>
    <path d="M760 690 q38 52 6 82 q-44 -22 -6 -82Z" fill="#ffb264" opacity=".75"/>
    <path d="M742 710 q24 34 4 56 q-28 -16 -4 -56Z" fill="#ffe0a6" opacity=".7"/>
    <g fill="#3a2614"><rect x="690" y="758" width="44" height="18"/><rect x="742" y="758" width="52" height="18"/><rect x="800" y="758" width="40" height="18"/></g>
  </g>

  <!-- shelf with bottles -->
  <g>
    <rect x="1010" y="420" width="300" height="12" fill="#3a2a18"/>
    <rect x="1010" y="540" width="300" height="12" fill="#3a2a18"/>
    <g fill="#43331f">
      <rect x="1030" y="470" width="18" height="70"/><rect x="1052" y="484" width="14" height="56"/>
      <rect x="1072" y="460" width="20" height="80"/><rect x="1100" y="488" width="12" height="52"/>
      <rect x="1120" y="474" width="18" height="66"/><rect x="1180" y="466" width="16" height="74"/>
      <rect x="1202" y="486" width="20" height="54"/><rect x="1230" y="472" width="14" height="68"/>
    </g>
    <g fill="#5d3d1e">
      <rect x="1040" y="600" width="20" height="60"/><rect x="1068" y="612" width="14" height="48"/>
      <rect x="1092" y="596" width="18" height="64"/><rect x="1150" y="604" width="22" height="56"/>
      <rect x="1180" y="616" width="14" height="44"/>
    </g>
  </g>

  <!-- hanging lamps -->
  <g>
    <path d="M420 52 L420 190" stroke="#2c2013" stroke-width="3"/>
    <path d="M420 190 L462 240 L378 240Z" fill="#241809"/>
    <circle cx="420" cy="232" r="120" fill="url(#fire)" opacity=".5" filter="url(#soft)"/>
    <path d="M420 214 q16 20 0 34 q-16 -14 0 -34Z" fill="#ffcd8b" opacity=".85"/>
    <path d="M1290 52 L1290 210" stroke="#2c2013" stroke-width="3"/>
    <path d="M1290 210 L1332 260 L1248 260Z" fill="#241809"/>
    <circle cx="1290" cy="252" r="120" fill="url(#fire)" opacity=".45" filter="url(#soft)"/>
    <path d="M1290 234 q16 20 0 34 q-16 -14 0 -34Z" fill="#ffcd8b" opacity=".85"/>
  </g>

  <!-- tables and stools -->
  <g>
    <ellipse cx="330" cy="740" rx="250" ry="58" fill="#0c0805"/>
    <ellipse cx="330" cy="726" rx="250" ry="52" fill="#2a1c10"/>
    <ellipse cx="330" cy="722" rx="230" ry="44" fill="#332314"/>
    <rect x="300" y="770" width="26" height="130" fill="#1d140b"/>
    <rect x="360" y="770" width="26" height="130" fill="#1d140b"/>
    <g fill="#241809"><ellipse cx="90" cy="800" rx="42" ry="16"/><rect x="70" y="806" width="10" height="70"/><rect x="102" y="806" width="10" height="70"/></g>
    <g fill="#241809"><ellipse cx="560" cy="812" rx="40" ry="15"/><rect x="540" y="818" width="10" height="66"/><rect x="572" y="818" width="10" height="66"/></g>
    <g fill="#3a2614"><rect x="250" y="700" width="22" height="30"/><rect x="292" y="694" width="18" height="36"/><rect x="330" y="702" width="24" height="28"/></g>
    <ellipse cx="1290" cy="770" rx="240" ry="54" fill="#0c0805"/>
    <ellipse cx="1290" cy="758" rx="240" ry="48" fill="#2a1c10"/>
    <rect x="1260" y="800" width="24" height="110" fill="#1d140b"/>
    <rect x="1320" y="800" width="24" height="110" fill="#1d140b"/>
  </g>

  <!-- floor -->
  <path d="M0 830 L1600 830 L1600 900 L0 900Z" fill="#080604"/>
  <g stroke="#1e150d" stroke-width="2" opacity=".8">
    <path d="M0 856 L1600 856"/><path d="M200 900 L280 830"/><path d="M700 900 L740 830"/><path d="M1140 900 L1100 830"/>
  </g>

  <!-- smoke -->
  <g fill="#d8c7a8" opacity=".1" filter="url(#soft2)">
    <ellipse cx="760" cy="520" rx="120" ry="60"/><ellipse cx="820" cy="430" rx="80" ry="44"/>
  </g>
</svg>
