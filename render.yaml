services:
  - type: web
    name: dnd-ds
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Paste your Neon connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
